name: Feature request
description: Propose an improvement with a concrete maintenance use case.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintenance problem
      description: What task is difficult today? Include an example where possible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you would want to see, including a sample command or finding if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, configuration, or simpler approaches that could address the problem.
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and tradeoffs
      description: Consider false positives, platform differences, dependencies, and the offline audit boundary.
