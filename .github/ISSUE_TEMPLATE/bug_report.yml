name: Bug report
description: Report an incorrect finding, missed link, or command failure.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Include a small example we can reproduce offline. Remove secrets and private content.
        For security-sensitive reports, follow SECURITY.md instead of posting details here.
  - type: input
    id: version
    attributes:
      label: Preflight version or commit
      description: Run maintainer-preflight --version, or provide the source commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: Include relevant .maintainer-preflight.toml settings.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the Markdown, directory layout, and steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior or output
      render: text
    validations:
      required: true
